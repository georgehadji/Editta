[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "editta"
version = "0.1.0"
description = "AI editorial assistant for publishing houses"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.162",  # Depends(scope="function"): commit before responding
  "uvicorn[standard]>=0.32",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "anthropic>=2.5",  # transform_schema; brings httpx2
  "httpx2>=2.16",
  "python-docx>=1.1",
  "pypdf>=5.1",
  "structlog>=24.4",
  "uvloop>=0.21; sys_platform != 'win32'",
  "stripe>=15.4",
  "slowapi>=0.1.9",
  "jinja2>=3.1",
  "python-multipart>=0.0.17",
  "aioboto3>=13.2",
  "itsdangerous>=2.2",
  "rapidfuzz>=3.10",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "hypothesis>=6.122",
  "testcontainers[postgres]>=4.9",
  "pre-commit>=4.0",
  "bandit>=1.8",
  "pip-audit>=2.7",
]

[project.scripts]
editta = "editta.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/editta"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aioboto3.*", "testcontainers.*", "uvloop"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src/editta --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/editta"]
branch = true
# Entrypoints/adapters whose real code paths need a live Postgres/S3/Docker to
# exercise (tests/adapters/test_persistence_integration.py covers repositories.py +
# postgres.py's actual behavior, but only runs when Docker is reachable). Not a
# blanket excuse — every other adapter (parsing, export, local storage, LLM client's
# pure helpers) is covered without infra.
omit = [
    "src/editta/cli.py",
    "src/editta/worker/main.py",
    "src/editta/adapters/persistence/repositories.py",
    "src/editta/adapters/persistence/uow.py",
    "src/editta/adapters/queue/postgres.py",
    "src/editta/adapters/storage/s3.py",
    "src/editta/adapters/email/smtp.py",
]

[tool.bandit]
exclude_dirs = ["tests"]
