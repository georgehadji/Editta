[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "editta"
version = "0.1.0"
description = "AI editorial assistant for publishing houses"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "anthropic>=0.40",
  "python-docx>=1.1",
  "pypdf>=5.1",
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "sentry-sdk[fastapi]>=2.18",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "uvloop>=0.21; sys_platform != 'win32'",
  "stripe>=11.3",
  "slowapi>=0.1.9",
  "jinja2>=3.1",
  "python-multipart>=0.0.17",
  "aioboto3>=13.2",
  "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "hypothesis>=6.122",
  "testcontainers[postgres]>=4.9",
  "pre-commit>=4.0",
  "bandit>=1.8",
  "pip-audit>=2.7",
]

[project.scripts]
editta = "editta.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/editta"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aioboto3.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src/editta --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/editta"]
branch = true
omit = ["src/editta/cli.py"]

[tool.bandit]
exclude_dirs = ["tests"]
