[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "editta"
version = "0.1.0"
description = "AI editorial assistant for publishing houses"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.162",  # Depends(scope="function"): commit before responding
  "uvicorn[standard]>=0.32",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "anthropic>=2.5",  # transform_schema; brings httpx2
  "httpx2>=2.16",
  "python-docx>=1.1",
  "pypdf>=5.1",
  "structlog>=24.4",
  "uvloop>=0.21; sys_platform != 'win32'",
  "stripe>=15.4",
  "slowapi>=0.1.9",
  "jinja2>=3.1",
  "python-multipart>=0.0.17",
  "aioboto3>=13.2",
  "itsdangerous>=2.2",
  "rapidfuzz>=3.10",
]

[project.optional-dependencies]
# Shared rate-limit counters across API processes (EDITTA_RATE_LIMIT_STORAGE_URI=redis://...).
redis = ["redis>=5.0"]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "hypothesis>=6.122",
  "testcontainers[postgres]>=4.9",
  "moto[server]>=5.0",  # in-process S3 for the presigned-URL test
  "playwright>=1.48",  # tests/e2e: the dashboard's error states in headless Chromium
  "pre-commit>=4.0",
  "bandit>=1.8",
  "pip-audit>=2.7",
  "import-linter>=2.0",
]

[project.scripts]
editta = "editta.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/editta"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aioboto3.*", "testcontainers.*", "uvloop"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src/editta --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/editta"]
branch = true
# Entrypoints/adapters whose real code paths need a live Postgres/S3/Docker to
# exercise (tests/adapters/test_persistence_integration.py covers repositories.py +
# postgres.py's actual behavior, but only runs when Docker is reachable). Not a
# blanket excuse — every other adapter (parsing, export, local storage, LLM client's
# pure helpers) is covered without infra.
omit = [
    "src/editta/cli.py",
    "src/editta/worker/main.py",
    "src/editta/adapters/persistence/repositories.py",
    "src/editta/adapters/persistence/uow.py",
    "src/editta/adapters/queue/postgres.py",
    "src/editta/adapters/storage/s3.py",
    "src/editta/adapters/email/smtp.py",
]

[tool.bandit]
exclude_dirs = ["tests"]

# The dependency rule of docs/PLAN.md §2 (see docs/adr/0001-dependency-rule.md), checked in CI by
# `lint-imports`. Composition roots (api/deps.py, api/main.py, worker/main.py,
# worker/retention.py, cli.py) are the one place allowed to name concrete adapters.
[tool.importlinter]
root_package = "editta"

[[tool.importlinter.contracts]]
name = "The domain imports nothing above it"
type = "forbidden"
source_modules = ["editta.domain"]
forbidden_modules = [
    "editta.passes",
    "editta.services",
    "editta.adapters",
    "editta.api",
    "editta.worker",
    "editta.cli",
]

[[tool.importlinter.contracts]]
name = "Passes depend on the domain only"
type = "forbidden"
source_modules = ["editta.passes"]
forbidden_modules = [
    "editta.services",
    "editta.adapters",
    "editta.api",
    "editta.worker",
    "editta.cli",
]

[[tool.importlinter.contracts]]
name = "Adapters do not import the layers above them"
type = "forbidden"
source_modules = ["editta.adapters"]
forbidden_modules = ["editta.services", "editta.api", "editta.worker", "editta.cli"]

[[tool.importlinter.contracts]]
name = "Adapters do not import each other"
type = "independence"
modules = [
    "editta.adapters.email",
    "editta.adapters.export",
    "editta.adapters.llm",
    "editta.adapters.parsing",
    "editta.adapters.persistence",
    "editta.adapters.queue",
    "editta.adapters.storage",
]
# The one documented sibling edge: the annotated-manuscript exporter re-walks the file with
# the parser's own text helpers, so both sides compute the same offsets.
ignore_imports = [
    "editta.adapters.export.annotated_docx -> editta.adapters.parsing.docx",
    "editta.adapters.export.annotated_docx -> editta.adapters.parsing.safety",
]

# Known violations, one line each, found by the architecture audit of 2026-11-11. They are
# fixed by docs/ARCH_REMEDIATION_PLAN.md item 6, and each fix deletes its line: an entry that
# no longer matches an import fails the build, so this list can only shrink.
[[tool.importlinter.contracts]]
name = "Services do not import adapters, the API or the worker"
type = "forbidden"
source_modules = ["editta.services"]
forbidden_modules = ["editta.adapters", "editta.api", "editta.worker", "editta.cli"]
allow_indirect_imports = true
ignore_imports = [
    "editta.services.accounts -> editta.adapters.persistence.repositories",
    "editta.services.jobs -> editta.adapters.export.annotated_docx",
    "editta.services.jobs -> editta.adapters.export.docx_builder",
    "editta.services.jobs -> editta.adapters.parsing",
    "editta.services.jobs -> editta.adapters.persistence.repositories",
    "editta.services.pipeline -> editta.adapters.parsing",
    "editta.services.reports -> editta.adapters.persistence.repositories",
    "editta.services.retention -> editta.adapters.persistence.repositories",
    "editta.services.uploads -> editta.adapters.parsing",
    "editta.services.uploads -> editta.adapters.persistence.repositories",
]

[[tool.importlinter.contracts]]
name = "Routes do not import adapters"
type = "forbidden"
source_modules = ["editta.api.routes"]
forbidden_modules = ["editta.adapters"]
allow_indirect_imports = true
ignore_imports = [
    "editta.api.routes.billing -> editta.adapters.persistence.repositories",
    "editta.api.routes.billing -> editta.adapters.persistence.uow",
    "editta.api.routes.manuscripts -> editta.adapters.persistence.repositories",
    "editta.api.routes.web -> editta.adapters.email.console",
    "editta.api.routes.web -> editta.adapters.persistence.repositories",
]
