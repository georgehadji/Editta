name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Mypy (strict)
        run: mypy src

      - name: Pytest + coverage
        run: pytest

      - name: Bandit (SAST)
        run: bandit -r src -c pyproject.toml

      - name: pip-audit
        # Audit the installed third-party dependencies, not the project itself:
        # `editta` is installed editable and is not on PyPI, so a plain
        # `pip-audit --strict` always failed with "Dependency not found on PyPI".
        run: |
          pip freeze --exclude-editable > "$RUNNER_TEMP/audit-requirements.txt"
          pip-audit --strict --no-deps --disable-pip -r "$RUNNER_TEMP/audit-requirements.txt"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
