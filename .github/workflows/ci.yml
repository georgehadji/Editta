name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # The browser test (tests/e2e) needs only Chromium's headless shell. The runner
      # image already has the system libraries it needs, so no --with-deps (apt took
      # ~20 s); the binary itself is cached per Playwright version.
      - name: Playwright version
        id: playwright
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Chromium headless shell
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --only-shell chromium

      - name: Ruff
        run: ruff check src tests evals

      - name: Mypy (strict)
        run: mypy src

      - name: Import contracts (architecture)
        run: lint-imports

      - name: Pytest + coverage
        run: pytest

      - name: Bandit (SAST)
        run: bandit -r src -c pyproject.toml

      - name: pip-audit
        # Audit the installed third-party dependencies, not the project itself:
        # `editta` is installed editable and is not on PyPI, so a plain
        # `pip-audit --strict` always failed with "Dependency not found on PyPI".
        run: |
          pip freeze --exclude-editable > "$RUNNER_TEMP/audit-requirements.txt"
          pip-audit --strict --no-deps --disable-pip -r "$RUNNER_TEMP/audit-requirements.txt"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
